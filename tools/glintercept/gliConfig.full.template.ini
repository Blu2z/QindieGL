// QindieGL/YAE GLIntercept FULL trace.
// Generated paths are substituted by Prepare-YAETrace.ps1.

FunctionLog
{
  LogEnabled = True;
  LogFlush = True;
  LogFileName = "gliInterceptLog_FULL";
  LogMaxNumFrames = 300;
}

LogPerFrame
{
  Enabled = False;
  FrameStartKeys = (ctrl,shift,f);
  OneFrameOnly = True;
}

InputFiles
{
  GLFunctionDefines = "@GL_FUNCTION_DEFINES@";
  GLSystemLib = "@QINDIEGL_DLL@";
}

ErrorChecking
{
  GLErrorChecking = True;
  ThreadChecking = False;
  BreakOnError = False;
  LogOnError = True;
  ExtendedErrorLog = False;
  DebuggerErrorLog = False;
}

ImageLog { LogEnabled = False; }
ShaderLog { LogEnabled = False; }
DisplayListLog { LogEnabled = False; }
FrameLog { LogEnabled = False; }
TimerLog { LogEnabled = False; }

PluginData
{
  BaseDir = "@PLUGIN_DIR@";
  Plugins { }
}
