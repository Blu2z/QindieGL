// QindieGL/YAE GLIntercept SUMMARY trace.
// Full call logging is disabled; GLFuncStats writes per-function counts to
// gliLog.txt at shutdown while QindieGL.log supplies structured state events.

FunctionLog
{
  LogEnabled = False;
  LogFlush = False;
  LogFileName = "gliInterceptLog_SUMMARY";
}

LogPerFrame
{
  Enabled = False;
  FrameStartKeys = (ctrl,shift,f);
  OneFrameOnly = True;
}

InputFiles
{
  GLFunctionDefines = "@GL_FUNCTION_DEFINES@";
  GLSystemLib = "@QINDIEGL_DLL@";
}

ErrorChecking
{
  GLErrorChecking = True;
  ThreadChecking = False;
  BreakOnError = False;
  LogOnError = True;
  ExtendedErrorLog = False;
  DebuggerErrorLog = False;
}

ImageLog { LogEnabled = False; }
ShaderLog { LogEnabled = False; }
DisplayListLog { LogEnabled = False; }
FrameLog { LogEnabled = False; }
TimerLog { LogEnabled = False; }

PluginData
{
  BaseDir = "@PLUGIN_DIR@";
  Plugins
  {
    FunctionStats = ("GLFuncStats/GLFuncStats.dll")
    {
      PluginEnabled = True;
      LogCallCountSort = True;
      LogFunctionNameSort = True;
    }
  }
}
