// Low-overhead GLIntercept chain configuration for normal YAE test runs.
// QindieGL.log remains enabled; per-call tracing and glGetError injection do not.

FunctionLog
{
  LogEnabled = False;
  LogFlush = False;
  LogFileName = "gliInterceptLog_RUNTIME";
}

LogPerFrame { Enabled = False; }

InputFiles
{
  GLFunctionDefines = "QindieGL-GLFunctions\\QindieGL-gliIncludes.h";
  GLSystemLib = "QindieGL-traced.dll";
}

ErrorChecking
{
  GLErrorChecking = False;
  ThreadChecking = False;
  BreakOnError = False;
  LogOnError = False;
}

ImageLog { LogEnabled = False; }
ShaderLog { LogEnabled = False; }
DisplayListLog { LogEnabled = False; }
FrameLog { LogEnabled = False; }
TimerLog { LogEnabled = False; }

PluginData { Plugins { } }
