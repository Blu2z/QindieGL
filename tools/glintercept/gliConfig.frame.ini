// QindieGL/YAE single-frame GL trace: press Ctrl+Shift+F in game to log every
// GL call of the next frame with its arguments (gliInterceptLog_FRAME.txt).
// No per-call error checking, so normal play keeps its frame rate.

FunctionLog
{
  LogEnabled = True;
  LogFlush = False;
  LogFileName = "gliInterceptLog_FRAME";
}

LogPerFrame
{
  Enabled = True;
  FrameStartKeys = (ctrl,shift,f);
  OneFrameOnly = True;
}

InputFiles
{
  GLFunctionDefines = "QindieGL-GLFunctions\\QindieGL-gliIncludes.h";
  GLSystemLib = "QindieGL-traced.dll";
}

ErrorChecking
{
  GLErrorChecking = False;
  ThreadChecking = False;
  BreakOnError = False;
  LogOnError = False;
}

ImageLog { LogEnabled = False; }
ShaderLog { LogEnabled = False; }
DisplayListLog { LogEnabled = False; }
FrameLog { LogEnabled = False; }
TimerLog { LogEnabled = False; }

PluginData { Plugins { } }
