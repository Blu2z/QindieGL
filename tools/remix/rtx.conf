# You Are Empty through QindieGL (Phase G). Remix rewrites this file without
# comments when settings are saved from its menu, and moves user settings such
# as rtx.dlfg.enable to user.conf.

# DLSS frame generation off: the first run crashed in the NVIDIA driver
# (vkQueueSubmit) within a second of Remix enabling it; runs without it did not.
rtx.dlfg.enable = False

# DS2's world is Z-up.
rtx.zUp = True

# Fixed exposure, as DS2's baked lighting has: with eye adaptation Remix
# brings every view to the same average brightness, so darker outdoor light
# made no difference. 5.3 is what eye adaptation gave dark interiors (EV100
# at its minimum of -2: 0.75 * 0.18 / (0.03125 * 0.82)). Tune it in the Remix
# menu: Rendering, Post-Processing, Tonemapping, Exposure Level.
rtx.autoExposure.enabled = False
rtx.localtonemap.exposure = 5.3

# DS2 draws its sky first, with a rotation-only camera at the origin: take the
# first camera position of each frame as the sky camera.
rtx.skyAutoDetect = 1
# Overcast outdoor light: sky and sun at an eighth of the defaults.
rtx.skyBrightness = 0.125

# Sun: always added (DS2 lights the world with lightmaps, which Remix does not
# use), from the direction of DS2's fake shadows (r_mdl_fs_dir), at an eighth
# of the default radiance of 1.6, 1.8, 2.
rtx.fallbackLightMode = 2
rtx.fallbackLightDirection = 0.1, 0.1, -0.8
rtx.fallbackLightRadiance = 0.2, 0.225, 0.25

# DS2 lights its models with GL point/spot lights without attenuation, and
# QindieGL passes GL's unlimited range as D3D9 Range = sqrt(FLT_MAX). Remix
# makes such a light bright enough to reach that range (~1e38), so every lamp
# ends up at this cap: 4.5 times the first tested value of 18. The sphere
# radius stays at the default rtx.lightConversionSphereLightFixedRadius = 4.
rtx.lightConversionMaxIntensity = 81

# DS2 does not draw what is outside the view, so walls and roofs behind the
# player vanish from the ray-traced scene and let outdoor light in. Keep
# objects that leave the view frustum.
rtx.antiCulling.object.enable = True

# Decals (multiply-blended, drawn over the world), tagged in the Remix menu.
rtx.decalTextures = 0x089BB77116BC0C37, 0x1918F38FA179CA08, 0x348A81CD6027CA95, 0x3D632BF204FE9DF6, 0x5C72A55322E76DCB, 0x72016FFC7AC94B45, 0x8D8866202F4963CC, 0xABE5397E7E8DBEBF, 0xB85E0CF2840B5992, 0xD9D5A1B60A2FF842, 0xDDEAE0262F2C3784, 0xFC5CE5350332B478, 0xFFA312130447FBA4, 0xFFE4700D6A158C9C
