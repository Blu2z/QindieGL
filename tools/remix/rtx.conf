# You Are Empty through QindieGL (Phase G). Remix rewrites this file without
# comments when settings are saved from its menu.

# DLSS frame generation off: the first run crashed in the NVIDIA driver
# (vkQueueSubmit) within a second of Remix enabling it; runs without it did not.
rtx.dlfg.enable = False

# DS2's world is Z-up.
rtx.zUp = True

# DS2 draws its sky first, with a rotation-only camera at the origin: take the
# first camera position of each frame as the sky camera.
rtx.skyAutoDetect = 1
# Outdoor light at half strength: sky and sun.
rtx.skyBrightness = 0.5

# Sun: always added (DS2 lights the world with lightmaps, which Remix does not
# use), from the direction of DS2's fake shadows (r_mdl_fs_dir), at half the
# default radiance of 1.6, 1.8, 2.
rtx.fallbackLightMode = 2
rtx.fallbackLightDirection = 0.1, 0.1, -0.8
rtx.fallbackLightRadiance = 0.8, 0.9, 1

# DS2 lights its models with GL point/spot lights without attenuation, and
# QindieGL passes GL's unlimited range as D3D9 Range = sqrt(FLT_MAX). Remix
# makes such a light bright enough to reach that range (~1e38), so every lamp
# ends up at this cap. 36 = twice the first tested value; the sphere radius
# stays at the default rtx.lightConversionSphereLightFixedRadius = 4.
rtx.lightConversionMaxIntensity = 36

# Decals (multiply-blended, drawn over the world), tagged in the Remix menu.
rtx.decalTextures = 0x1918F38FA179CA08, 0x3D632BF204FE9DF6, 0x8D8866202F4963CC, 0xD9D5A1B60A2FF842, 0xFC5CE5350332B478, 0xFFE4700D6A158C9C
